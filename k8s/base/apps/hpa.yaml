# ==============================================================================
# HorizontalPodAutoscaler (HPA) - Otomatik Pod Ölçeklendirme
# ==============================================================================
# Yük arttığında Nginx + PHP-FPM Pod sayısını otomatik olarak artıran 
# ve yük düştüğünde azartan Kubernetes HPA kaynağı.
# ==============================================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
