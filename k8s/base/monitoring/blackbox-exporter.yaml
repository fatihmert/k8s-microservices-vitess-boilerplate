# ==============================================================================
# Prometheus Blackbox Exporter (Dış Dünya Sintetik Uç Nokta ve SSL Takibi)
# ==============================================================================
# Blackbox Exporter, uygulama domainlerimizin (app.local / app.cyclechain.io)
# dışarıdan HTTP 200 OK verip vermediğini ve SSL sertifikasının bitiş süresini izler.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  labels:
    app.kubernetes.io/name: blackbox-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blackbox-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blackbox-exporter
    spec:
      containers:
        - name: blackbox-exporter
          image: prom/blackbox-exporter:v0.25.0
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 9115
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 9115
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 9115
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  labels:
    app.kubernetes.io/name: blackbox-exporter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: blackbox-exporter
  ports:
    - name: http
      port: 9115
      targetPort: 9115
---
# ==============================================================================
# Prometheus Operator Probe (Synthetic HTTP Probe & SSL Expiry Monitor)
# ==============================================================================
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: app-synthetic-probe
  labels:
    release: kube-prometheus-stack
spec:
  jobName: app-synthetic-probe
  interval: 30s
  module: http_2xx
  prober:
    url: blackbox-exporter:9115
  targets:
    staticConfig:
      targets:
        - http://app-service.default.svc.cluster.local
