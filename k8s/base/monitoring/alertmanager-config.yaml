# ==============================================================================
# AlertmanagerConfig - Otomatik Alarm Bildirim Kanalları Yapılandırması
# ==============================================================================
# Bu kaynak, Prometheus alarmlarının Discord, Slack veya Webhook kanalına
# otomatik olarak iletilmesini sağlar.
# ==============================================================================
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: cyclechain-alert-notifications
  labels:
    release: kube-prometheus-stack
spec:
  route:
    receiver: 'webhook-receiver'
    groupBy: ['alertname', 'namespace']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
  receivers:
    - name: 'webhook-receiver'
      webhookConfigs:
        - url: 'http://127.0.0.1:5001/alerts' # Geliştirme webhook mock adresi (veya Discord/Slack webhook URL'i)
          sendResolved: true
