apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

# Temel Kubernetes manifest kaynakları
resources:
  - apps/app.yaml
  - apps/hpa.yaml
  - apps/ingress.yaml
  - apps/phpmyadmin.yaml
  - datastores/mysql.yaml
  - datastores/redis.yaml
  - datastores/vitess.yaml

# Otomatik Secret üreteci (Vitess VTGate Auth)
secretGenerator:
  - name: vtgate-auth
    files:
      - configs/users.json

# Otomatik ConfigMap üreteci
configMapGenerator:
  - name: nginx-config
    files:
      - configs/default.conf
